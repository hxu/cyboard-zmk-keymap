# A battery report also refreshes the layer color when the right half reconnects.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Five host profiles plus one connection/bond for the right half.
# Keep these central-only; the peripheral retains its own defaults.
CONFIG_BT_MAX_CONN=6
CONFIG_BT_MAX_PAIRED=6
